<!doctype html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOMO</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark" aria-label="JOMO logó"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M37 8C22 8 11 15 11 28c0 6 4 10 10 10C34 38 39 23 37 8Z" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 40c7-10 13-15 23-21" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg></div><div><strong>JOMO</strong><small>Tudatos digitális tér</small></div></div>
      <nav id="nav" class="nav">
        <button data-page="home" class="nav-item active"><span>⌂</span> Főoldal</button>
        <button data-page="noise" class="nav-item"><span>◉</span> Zajcsökkentő</button>
        <button data-page="garden" class="nav-item"><span>✿</span> Virtuális kert</button>
        <button data-page="offline" class="nav-item"><span>⌖</span> Offline élmények</button>
        <button data-page="profile" class="nav-item"><span>○</span> Profil</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="mini-status"><span class="dot"></span><span>JOMO aktív</span></div>
        <button class="mode-toggle" id="modeToggle"><span>▣</span><span id="modeLabel">Mobil nézet</span></button><button class="mode-toggle" onclick="toggleDarkMode()">☾ Megjelenés váltása</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar"><div><div class="eyebrow">MA, OKTÓBER 5.</div><h1 id="pageTitle">Jó, hogy itt vagy.</h1></div><div class="top-actions"><button class="theme-toggle" id="themeToggle" onclick="toggleDarkMode()">🌙 Sötét mód</button><div class="points-badge">✦ <span id="points">420</span> pont</div><button class="avatar" onclick="setPage('profile')" aria-label="Profil megnyitása">A</button></div></header>
      <section id="app" class="app"></section>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <div id="locationModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-icon">⌖</div>
      <div class="pill green">HELYZET ENGEDÉLY</div>
      <h2>Használhatjuk a helyzetedet?</h2>
      <p class="muted">A JOMO a közeli offline programok megjelenítéséhez használhatja a telefonod vagy géped aktuális helyzetét. A pontos koordinátát nem mentjük el a JOMO-profilodba.</p>
      <div class="modal-actions"><button class="secondary" id="locationDeny">Most nem</button><button class="primary" id="locationAllow">Igen, engedélyezem</button></div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
